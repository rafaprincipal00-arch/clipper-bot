name: clipper

on:
  # No cron for now: the PC starts a "batch" run at the first Windows logon of the day
  # (scripts/logon_trigger.pyw) -> one clip every 8-9 min, accounts in turn, up to each platform's daily
  # cap: YouTube 6/day (API quota of the Google project, shared by the 3 channels), TikTok 3/account.
  workflow_dispatch:
    inputs:
      batch:
        description: "Clips for this run, accounts in turn (0 = classic auto run)"
        required: false
        default: "0"
      url:
        description: "Clip this one URL instead of the auto sources"
        required: false
      creator:
        description: "Creator name for the manual URL"
        required: false
        default: "creator"
      start:
        description: "Manual URL: window start (s)"
        required: false
        default: "0"
      end:
        description: "Manual URL: window end (s)"
        required: false
        default: "0"
      publish:
        description: "Publish to connected platforms"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
      YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_REFRESH_TOKEN_2: ${{ secrets.TIKTOK_REFRESH_TOKEN_2 }}
      TIKTOK_REFRESH_TOKEN_3: ${{ secrets.TIKTOK_REFRESH_TOKEN_3 }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
      CR_STATE: ${{ secrets.CR_STATE }}
      GH_TOKEN: ${{ github.token }}
      WHISPER_MODEL: small
      RUN_BUDGET_MIN: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          # Arial Black is not on Linux; libass falls back to the closest bold sans.
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium-headless-shell > /dev/null
      - name: Discover top campaigns
        run: python -m clipper.discover data/campaigns.json
      - name: Clip
        run: |
          PUB=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then PUB="--publish"; fi
          if [ "${{ inputs.batch }}" != "" ] && [ "${{ inputs.batch }}" != "0" ]; then
            # TikTok is posted later from the PC at scheduled times (scripts/tiktok_poster.py).
            TIKTOK_MODE=off TIKTOK_DAILY_MAX=9 CLIP_GAP_MIN=8 CLIP_GAP_MAX_MIN=9 python -m clipper.pipeline --auto --clips 3 \
              --total "${{ inputs.batch }}" --per-account $PUB
          elif [ -n "${{ inputs.url }}" ]; then
            python -m clipper.pipeline --url "${{ inputs.url }}" --creator "${{ inputs.creator }}" --start "${{ inputs.start }}" --end "${{ inputs.end }}" $PUB
          else
            python -m clipper.pipeline --auto --clips 10 $PUB
          fi
      - name: Rotate TikTok refresh token
        if: always()
        run: |
          if [ -f tiktok_refresh_token.new ]; then
            echo "TikTok issued a new refresh token; update the TIKTOK_REFRESH_TOKEN secret (see README)."
            rm tiktok_refresh_token.new
          fi
      - name: Delete raw windows
        if: always()
        run: rm -rf work   # unedited source never outlives the run
      - name: Upload clips as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit manifest
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          python scripts/commit_data.py
