name: tiktok-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Why does TikTok refuse the upload? (prints API error bodies only, never tokens)
        run: |
          python - <<'EOF'
          import json
          from clipper import publish as p
          tok = p._tiktok_token()
          auth = {"Authorization": f"Bearer {tok}", "Content-Type": "application/json; charset=UTF-8"}
          info = p._req("https://open.tiktokapis.com/v2/post/publish/creator_info/query/", b"{}", auth)
          print("creator_info:", json.dumps(info.get("data", {}).get("privacy_level_options")), info.get("error"))
          for privacy in ("SELF_ONLY",):
              try:
                  r = p._req("https://open.tiktokapis.com/v2/post/publish/video/init/", json.dumps({
                      "post_info": {"title": "probe", "privacy_level": privacy},
                      "source_info": {"source": "FILE_UPLOAD", "video_size": 1000000, "chunk_size": 1000000, "total_chunk_count": 1},
                  }).encode(), auth)
                  print(privacy, "init ok:", r.get("error"))
              except Exception as e:
                  print(privacy, "init failed:", e)
          EOF
