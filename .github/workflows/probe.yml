name: probe-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - name: Probe each platform from a datacenter IP
        run: |
          python - <<'EOF'
          from clipper.pipeline import latest_video
          for u in ["https://www.youtube.com/@MichaelSartain", "https://www.twitch.tv/mcqueennlive", "https://kick.com/tjr"]:
              try:
                  print("OK  ", latest_video(u))
              except Exception as e:
                  print("FAIL", u, type(e).__name__)
          EOF
          yt-dlp --no-warnings -f ba -o probe_yt.%(ext)s --download-sections "*60-70" https://www.youtube.com/watch?v=hCFKnO-It6I && echo YT_DOWNLOAD_OK || echo YT_DOWNLOAD_FAIL
